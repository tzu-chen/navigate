<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet" />
    <!-- Resolve the active theme before first paint to avoid a flash of the
         wrong scheme. Mirrors the light/dark decision in
         src/App.tsx + src/services/api.ts.
         The matching [data-theme] block in monolith-theme.css supplies the
         colours, so the very first paint is already right. Legacy scheme ids
         are listed alongside "graphite" so a value stored before the theme
         overhaul still resolves. -->
    <script>
      (function() {
        try {
          var DARK = { graphite: 1, dark: 1, nord: 1, dracula: 1, monokai: 1, 'default-dark': 1, 'solarized-dark': 1, 'one-dark-pro': 1, 'nord-dark': 1, 'dracula-dark': 1 };
          function isDark(id) { return !!(id && DARK[id]); }
          var dark = false;
          var prefs = null;
          try {{ prefs = JSON.parse(localStorage.getItem('navigate-visual-prefs')); }} catch (e) {{}}
          if (prefs) {{
            var auto = prefs.autoSwitch;
            if (auto && auto.enabled) {{
              var hour = new Date().getHours();
              var isDay = hour >= auto.dayStartHour && hour < auto.nightStartHour;
              dark = isDark(isDay ? auto.lightSchemeId : auto.darkSchemeId);
            }} else {{
              dark = isDark(prefs.colorScheme);
            }}
          }}
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme-type', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
